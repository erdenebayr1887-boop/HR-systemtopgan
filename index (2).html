<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Таван Толгой төсөл — Техник хувиарлалт ба цагийн тооцоо</title>
<style>
:root{--bg:#eef1f4;--card:#fff;--ink:#17232e;--mute:#5d6b78;--line:#d6dde4;--acc:#0e6b78;--day:#b7791f;--night:#3b4c9b;--rest:#6b7785;--free:#2f855a;--bad:#c0392b}
@media(prefers-color-scheme:dark){:root{--bg:#10171d;--card:#182129;--ink:#e6edf3;--mute:#93a1ad;--line:#2a3742;--acc:#4fb3c1;--day:#e0a545;--night:#8c9cf0;--rest:#93a1ad;--free:#5ec48d;--bad:#ef7b6d}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.4 "Segoe UI",Roboto,Arial,sans-serif}
header{padding:16px 20px 0;max-width:1500px;margin:auto}
h1{font-size:18px;margin:0 0 2px;font-weight:650}
.sub{color:var(--mute);font-size:13px}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:14px 0 0;border-bottom:1px solid var(--line)}
.tab{border:0;background:none;color:var(--mute);padding:9px 14px;font:inherit;font-weight:600;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px}
.tab[aria-selected=true]{color:var(--acc);border-color:var(--acc)}
.tools{margin-left:auto;display:flex;gap:8px;padding-bottom:6px;flex-wrap:wrap}
select,input{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:6px;padding:6px 9px}
input{min-width:200px}
:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
main{max-width:1500px;margin:14px auto;padding:0 20px 40px}
.wrap{overflow:auto;max-height:calc(100vh - 190px);background:var(--card);border:1px solid var(--line);border-radius:8px}
table{border-collapse:separate;border-spacing:0;width:100%}
th,td{padding:6px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{position:sticky;top:0;background:var(--card);z-index:2;font-size:12px;font-weight:650;border-bottom:2px solid var(--line)}
th small{display:block;color:var(--mute);font-weight:500}
tr.sec td{background:var(--bg);font-weight:700;color:var(--acc);position:sticky;left:0}
tr.tot td{font-weight:650;background:var(--bg)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.m{color:var(--mute)}
.p{cursor:pointer;border-radius:4px}.p:hover{background:var(--bg);text-decoration:underline}
.hd{border-top:3px solid var(--rest)}.hd.d{border-color:var(--day)}.hd.n{border-color:var(--night)}.hd.f{border-color:var(--free)}
.g{display:grid;grid-template-columns:repeat(30,minmax(30px,1fr));gap:2px;min-width:960px}
.g div{text-align:center;padding:3px 0;border-radius:3px;font-size:12px;background:var(--bg);font-variant-numeric:tabular-nums}
.g .h{background:none;color:var(--mute);font-size:11px;line-height:1.2}
.g .h.we{color:var(--bad)}
.g .v{background:color-mix(in srgb,var(--acc) 22%,transparent)}
.g .o{background:color-mix(in srgb,var(--day) 30%,transparent)}
.g .s{background:color-mix(in srgb,var(--night) 30%,transparent)}
.lbl{font-size:12px;color:var(--mute);margin:8px 0 2px}
.detail td{white-space:normal;background:var(--bg)}
.note{color:var(--bad)}
.leg{font-size:12px;color:var(--mute);margin:8px 2px}
.empty{padding:30px;text-align:center;color:var(--mute)}
[hidden]{display:none!important}
</style>
</head>
<body>
<header>
<h1>Таван Толгой төсөл — Уулын хэсгийн техник хувиарлалт ба цагийн тооцоо</h1>
<div class="sub">Өмнөговь аймаг, Цогтцэций сум. Эх сурвалж: техник хувиарлалт (22 долоо хоног), 9-р сарын цагийн тооцоо.</div>
<div class="bar" role="tablist">
<button class="tab" role="tab" data-t="a" aria-selected="true">Техник хувиарлалт</button>
<button class="tab" role="tab" data-t="h" aria-selected="false">9-р сарын цаг</button>
<div class="tools">
<select id="wk" aria-label="Долоо хоног"></select>
<select id="dep" aria-label="Хэлтэс" hidden><option value="">Бүх хэлтэс</option><option value="ТГД">ТГД</option><option value="ТГМ">ТГМ</option><option value="ЗГ">ЗГ</option></select>
<input id="q" type="search" placeholder="Нэр, албан тушаал, парк хайх" aria-label="Хайх">
</div>
</div>
</header>
<main>
<section id="a"><div class="wrap"><table id="ta"></table></div><div class="leg" id="la"></div></section>
<section id="h" hidden><div class="wrap"><table id="th"></table></div>
<div class="leg">Нийт цаг = өдөр + илүү цаг × 1.5 + шөнө × 1.2 (эх файлын томьёотой ижил). Мөр дээр дарвал өдөр тутмын цаг гарна.</div></section>
</main>

const $=s=>document.querySelector(s);
const norm=s=>String(s).toLowerCase().replace(/[^а-яөүёa-z]/g,'');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const WD=['Да','Мя','Лх','Пү','Ба','Бя','Ня'];
const sum=a=>a.reduce((x,y)=>x+(+y||0),0);
const fmt=n=>Number.isInteger(n)?n:n.toFixed(1);
// people index
const people=[];
for(const dep in D.ts)for(const p of D.ts[dep]){
  p.dep=dep;p.day_=sum(p.day);p.ot_=sum(p.ot);p.n_=sum(p.night);
  p.total=p.day_+p.ot_*1.5+p.n_*1.2;p.key=norm(p.ovog+p.ner);people.push(p)}
const byKey={};people.forEach(p=>byKey[p.key]=p);
let wk=D.weeks.length-1,tab='a',open=null;
$('#wk').innerHTML=D.weeks.map((w,i)=>`<option value="${i}">${w.sheet}</option>`).join('');
$('#wk').value=wk;
const cls=h=>/^ӨДӨР|^ӨДРИЙН/i.test(h)?'d':/ШӨНИЙН/i.test(h)?'n':/ЧӨЛӨӨТЭЙ/i.test(h)?'f':'';
const SEC=['ИТА','УУЛЫН ХЭСЭГ','ЗАСВАРЫН ХЭСЭГ'];
function assign(){
  const w=D.weeks[wk],q=norm($('#q').value),qq=$('#q').value.trim().toLowerCase();
  let h=`<tr><th>№</th><th>Техник</th><th>Парк</th><th>Албан тушаал</th>${w.heads.map(x=>{const m=x.match(/^(.*?)\s*(\(.*\))?$/);return `<th class="hd ${cls(x)}">${esc(m[1])}<small>${esc(m[2]||'')}</small></th>`}).join('')}</tr>`;
  let b='',n=0;
  for(const r of w.rows){
    const sec=SEC.includes(r.eq);
    const txt=(r.pos+' '+r.park+' '+r.eq+' '+r.p.join(' ')).toLowerCase();
    if(qq&&!txt.includes(qq))continue;
    n++;
    const cells=r.p.map(x=>{const p=x&&byKey[norm(x)];return `<td>${x?`<span class="${p?'p':''}" ${p?`data-k="${p.key}" title="9-р сарын цаг харах"`:''}>${esc(x)}</span>`:''}</td>`}).join('');
    const total=!r.pos&&r.p.some(x=>/^\d+$/.test(x));
    b+=`<tr class="${total?'tot':''}"><td class="m">${esc(r.n)}</td><td>${esc(r.eq)}</td><td>${esc(r.park)}</td><td>${esc(r.pos)}</td>${cells}</tr>`;
  }
  $('#ta').innerHTML='<thead>'+h+'</thead><tbody>'+(b||'<tr><td colspan="9" class="empty">Хайлтад тохирох мөр олдсонгүй</td></tr>')+'</tbody>';
  $('#la').textContent=w.notes.length?'Тэмдэглэл: '+w.notes.join(' | '):'';
}
function hours(){
  const dep=$('#dep').value,q=$('#q').value.trim().toLowerCase();
  const list=people.filter(p=>(!dep||p.dep===dep)&&(!q||(p.ovog+' '+p.ner+' '+p.pos+' '+p.dep).toLowerCase().includes(q)));
  let b='',T=[0,0,0,0];
  for(const p of list){
    T[0]+=p.day_;T[1]+=p.ot_;T[2]+=p.n_;T[3]+=p.total;
    const cur=curShift(p);
    b+=`<tr class="r" data-k="${p.key}" style="cursor:pointer"><td>${p.dep}</td><td>${esc(p.ovog)} <b>${esc(p.ner)}</b></td><td>${esc(p.pos)}</td><td>${cur}</td><td class="num">${fmt(p.day_)}</td><td class="num">${fmt(p.ot_)}</td><td class="num">${fmt(p.n_)}</td><td class="num"><b>${fmt(p.total)}</b></td><td class="note">${esc(p.note)}</td></tr>`;
    if(open===p.key)b+=`<tr class="detail"><td colspan="9">${grid(p)}</td></tr>`;
  }
  $('#th').innerHTML='<thead><tr><th>Хэлтэс</th><th>Овог нэр</th><th>Албан тушаал</th><th>Сүүлийн хувиарлалт</th><th class="num">Өдөр</th><th class="num">Илүү</th><th class="num">Шөнө</th><th class="num">Нийт</th><th>Тайлбар</th></tr></thead><tbody>'+
   (b||'<tr><td colspan="9" class="empty">Хайлтад тохирох хүн олдсонгүй</td></tr>')+
   (list.length?`<tr class="tot"><td colspan="4">Нийт ${list.length} хүн</td><td class="num">${fmt(T[0])}</td><td class="num">${fmt(T[1])}</td><td class="num">${fmt(T[2])}</td><td class="num">${fmt(T[3])}</td><td></td></tr>`:'')+'</tbody>';
}
function curShift(p){
  const w=D.weeks[D.weeks.length-1];
  for(const r of w.rows){const i=r.p.findIndex(x=>x&&norm(x)===p.key);if(i>=0)return esc(w.heads[i].replace(/\s*\(.*\)/,''))+' <span class="m">'+esc(r.park||r.eq)+'</span>'}
  return '<span class="m">—</span>';
}
function grid(p){
  const row=(a,c)=>a.map(v=>`<div class="${+v?c:''}">${+v?fmt(+v):''}</div>`).join('');
  const hd=Array.from({length:30},(_,i)=>{const w=WD[(i+1)%7];return `<div class="h ${w==='Бя'||w==='Ня'?'we':''}">${i+1}<br>${w}</div>`}).join('');
  return `<div style="overflow:auto"><div class="g">${hd}</div><div class="lbl">Өдөр</div><div class="g">${row(p.day,'v')}</div><div class="lbl">Илүү цаг</div><div class="g">${row(p.ot,'o')}</div><div class="lbl">Шөнө</div><div class="g">${row(p.night,'s')}</div></div>`;
}
function draw(){
  $('#a').hidden=tab!=='a';$('#h').hidden=tab!=='h';
  $('#wk').hidden=tab!=='a';$('#dep').hidden=tab!=='h';
  document.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-selected',t.dataset.t===tab));
  tab==='a'?assign():hours();
}
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{tab=t.dataset.t;draw()});
$('#wk').onchange=e=>{wk=+e.target.value;draw()};
$('#dep').onchange=draw;$('#q').oninput=draw;
document.addEventListener('click',e=>{
  const p=e.target.closest('.p');
  if(p){tab='h';open=p.dataset.k;$('#q').value='';$('#dep').value='';draw();const r=document.querySelector(`tr.r[data-k="${open}"]`);r&&r.scrollIntoView({block:'center'});return}
  const r=e.target.closest('tr.r');
  if(r){open=open===r.dataset.k?null:r.dataset.k;hours()}
});
draw();
</script>
